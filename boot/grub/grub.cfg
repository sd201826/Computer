set default=0
set timeout=10

insmod all_video
insmod gfxterm
insmod part_gpt
insmod part_msdos
insmod fat
insmod iso9660

if loadfont unicode; then
  terminal_output gfxterm
fi

set menu_color_normal=light-gray/black
set menu_color_highlight=black/light-cyan
set color_normal=light-gray/black
set color_highlight=black/light-cyan

menuentry "Windows 11 — Setup visual demo (not an installer)" {
  set demo_name="Windows 11"
  export demo_name
  configfile /boot/demo.cfg
}

menuentry "Windows 10 — Setup visual demo (not an installer)" {
  set demo_name="Windows 10"
  export demo_name
  configfile /boot/demo.cfg
}

menuentry "Windows 7 — Setup visual demo (not an installer)" {
  set demo_name="Windows 7"
  export demo_name
  configfile /boot/demo.cfg
}

menuentry "Windows Vista — Setup visual demo (not an installer)" {
  set demo_name="Windows Vista"
  export demo_name
  configfile /boot/demo.cfg
}

menuentry "Windows XP — Setup visual demo (not an installer)" {
  set demo_name="Windows XP"
  export demo_name
  configfile /boot/demo.cfg
}

menuentry "Restart computer" {
  reboot
}

menuentry "Power off computer" {
  halt
}
