name: Build Restore Lab Live OS

on:
  push:
    branches: [main]
    paths:
      - "config/**"
      - "os/**"
      - ".github/workflows/build-live-os.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Install Debian live-build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y live-build debootstrap squashfs-tools xorriso             grub-pc-bin grub-efi-amd64-bin mtools

      - name: Configure live image
        run: |
          chmod +x config/hooks/live/*.hook.chroot
          sudo lb config             --distribution trixie             --architectures amd64             --binary-images iso-hybrid             --archive-areas "main contrib non-free non-free-firmware"             --bootappend-live "boot=live components username=restore hostname=restore-lab"

      - name: Build live ISO
        run: |
          sudo lb build
          mkdir -p dist
          sudo cp live-image-amd64.hybrid.iso dist/Restore-Lab-Live-amd64.iso
          sudo chown "$USER:$USER" dist/Restore-Lab-Live-amd64.iso
          sha256sum dist/Restore-Lab-Live-amd64.iso | tee dist/SHA256SUMS.txt

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: Restore-Lab-Live-amd64
          path: |
            dist/Restore-Lab-Live-amd64.iso
            dist/SHA256SUMS.txt
          retention-days: 14

      - name: Publish live ISO release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="Restore Lab Live is a Debian-based Linux live system with XFCE, Firefox ESR, Thunar and Calamares. It is NOT Microsoft Windows. Installing it can change or erase the selected disk; back up first."
          if gh release view restore-lab-live-latest >/dev/null 2>&1; then
            gh release upload restore-lab-live-latest dist/Restore-Lab-Live-amd64.iso dist/SHA256SUMS.txt --clobber
            gh release edit restore-lab-live-latest --title "Restore Lab Live (Linux)" --notes "$NOTES"
          else
            gh release create restore-lab-live-latest dist/Restore-Lab-Live-amd64.iso dist/SHA256SUMS.txt --title "Restore Lab Live (Linux)" --notes "$NOTES"
          fi
