name: Build Restore Lab Installer ISO

on:
  push:
    branches: [main]
    paths:
      - "config/**"
      - "os/**"
      - ".github/workflows/build-live-os.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Check Docker availability
        run: docker --version

      - name: Build installable live ISO with matching Debian Trixie tools
        run: |
          docker run --privileged --rm \
            --volume "${GITHUB_WORKSPACE}:/workspace" \
            --workdir /workspace \
            debian:trixie \
            bash -euo pipefail -c '
              export DEBIAN_FRONTEND=noninteractive

              apt-get update
              apt-get install -y --no-install-recommends \
                live-build \
                isolinux \
                syslinux-common \
                debootstrap \
                debian-archive-keyring \
                squashfs-tools \
                xorriso \
                grub-pc-bin \
                grub-efi-amd64-bin \
                mtools

              echo "Using Debian Trixie live-build:"
              lb --version

              # These live-build templates are symlinks to files supplied by
              # isolinux and syslinux-common. Verify the links resolve.
              dpkg-query -W isolinux syslinux-common
              test -s /usr/share/live/build/bootloaders/isolinux/isolinux.bin
              test -s /usr/share/live/build/bootloaders/syslinux_common/vesamenu.c32
              ls -l /usr/share/live/build/bootloaders/isolinux/isolinux.bin
              ls -l /usr/share/live/build/bootloaders/syslinux_common/vesamenu.c32

              chmod +x config/hooks/live/*.hook.chroot
              rm -rf dist
              mkdir -p dist

              lb config \
                --mode debian \
                --distribution trixie \
                --architectures amd64 \
                --initsystem systemd \
                --binary-images iso-hybrid \
                --archive-areas "main non-free-firmware" \
                --security false \
                --apt-recommends false \
                --apt-indices false \
                --firmware-chroot false \
                --firmware-binary false \
                --bootappend-live "boot=live components username=restore hostname=restore-lab"

              lb build

              test -s live-image-amd64.hybrid.iso
              cp live-image-amd64.hybrid.iso dist/Restore-Lab-Installer-amd64.iso

              SIZE_BYTES="$(stat -c%s dist/Restore-Lab-Installer-amd64.iso)"
              SIZE_MIB="$((SIZE_BYTES / 1024 / 1024))"
              echo "Installer ISO size: ${SIZE_MIB} MiB"
              if [ "$SIZE_BYTES" -gt 2147483648 ]; then
                echo "::error::ISO is larger than the 2 GiB target. Reduce the package set before publishing."
                exit 1
              fi

              sha256sum dist/Restore-Lab-Installer-amd64.iso | tee dist/SHA256SUMS.txt
            '

      - name: Upload installer ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: Restore-Lab-Installer-amd64
          path: |
            dist/Restore-Lab-Installer-amd64.iso
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

      - name: Publish installable ISO
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="Restore Lab is a Debian-based Linux live USB with a graphical Calamares installer. Boot the USB and choose Install Restore Lab to install the Linux system to a selected drive. It is NOT Microsoft Windows and contains no Windows installation files. Installing to a drive can erase its contents, including an existing Windows installation; back up first and inspect the target drive carefully."
          if gh release view restore-lab-live-latest >/dev/null 2>&1; then
            gh release delete-asset restore-lab-live-latest Restore-Lab-Setup-Preview-amd64.iso --yes || true
            gh release upload restore-lab-live-latest dist/Restore-Lab-Installer-amd64.iso dist/SHA256SUMS.txt --clobber
            gh release edit restore-lab-live-latest --title "Restore Lab Installer (Debian-based live USB)" --notes "$NOTES"
          else
            gh release create restore-lab-live-latest dist/Restore-Lab-Installer-amd64.iso dist/SHA256SUMS.txt --title "Restore Lab Installer (Debian-based live USB)" --notes "$NOTES"
          fi
