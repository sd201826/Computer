name: Build Restore Lab Setup Preview ISO

on:
  push:
    branches: [main]
    paths:
      - "config/**"
      - "os/**"
      - ".github/workflows/build-live-os.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Install Debian live-build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y live-build debootstrap debian-archive-keyring squashfs-tools xorriso grub-pc-bin grub-efi-amd64-bin mtools

      - name: Configure compact Debian live image
        run: |
          chmod +x config/hooks/live/*.hook.chroot
          sudo lb config \
            --mode debian \
            --distribution trixie \
            --architectures amd64 \
            --initsystem systemd \
            --binary-images iso-hybrid \
            --archive-areas "main non-free-firmware" \
            --security false \
            --apt-recommends false \
            --apt-indices false \
            --firmware-chroot false \
            --firmware-binary false \
            --bootappend-live "boot=live components username=restore hostname=restore-lab"

      - name: Build live ISO
        run: |
          sudo lb build
          mkdir -p dist
          sudo cp live-image-amd64.hybrid.iso dist/Restore-Lab-Setup-Preview-amd64.iso
          sudo chown "$USER:$USER" dist/Restore-Lab-Setup-Preview-amd64.iso
          SIZE_BYTES="$(stat -c%s dist/Restore-Lab-Setup-Preview-amd64.iso)"
          SIZE_MIB="$((SIZE_BYTES / 1024 / 1024))"
          echo "ISO size: ${SIZE_MIB} MiB"
          if [ "$SIZE_BYTES" -gt 2147483648 ]; then
            echo "::error::ISO is larger than the 2 GiB target. Reduce the package set before publishing."
            exit 1
          fi
          sha256sum dist/Restore-Lab-Setup-Preview-amd64.iso | tee dist/SHA256SUMS.txt

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: Restore-Lab-Setup-Preview-amd64
          path: |
            dist/Restore-Lab-Setup-Preview-amd64.iso
            dist/SHA256SUMS.txt
          retention-days: 14

      - name: Publish setup preview ISO
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="Restore Lab Setup Preview is a compact Debian Linux live USB that opens an original Windows-style setup simulator. It is NOT Microsoft Windows and contains no Windows installation files. The simulator does not install, repair, activate or modify any internal disk. Target size: no more than 2 GiB."
          if gh release view restore-lab-live-latest >/dev/null 2>&1; then
            gh release upload restore-lab-live-latest dist/Restore-Lab-Setup-Preview-amd64.iso dist/SHA256SUMS.txt --clobber
            gh release edit restore-lab-live-latest --title "Restore Lab Setup Preview (Demo ISO)" --notes "$NOTES"
          else
            gh release create restore-lab-live-latest dist/Restore-Lab-Setup-Preview-amd64.iso dist/SHA256SUMS.txt --title "Restore Lab Setup Preview (Demo ISO)" --notes "$NOTES"
          fi
